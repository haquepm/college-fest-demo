<!doctype html>
<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--ink:#17152d;--muted:#77768b;--purple:#6548d8;--purple2:#8069ed;--lime:#d8f36a;--bg:#f6f5fb;--line:#e9e7f1;--white:#fff;--green:#178b62;--red:#d45b66;--shadow:0 12px 35px #30215b0d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}.app{display:flex;min-height:100vh}.sidebar{width:245px;background:#201b3b;color:#fff;padding:25px 17px;display:flex;flex-direction:column;flex-shrink:0}.brand{display:flex;align-items:center;gap:11px;padding:2px 9px 28px}.brandmark{width:38px;height:38px;border-radius:13px;background:var(--lime);color:#211b3d;display:grid;place-items:center;font-weight:900;font-size:19px}.brand strong{font:800 19px Manrope}.brand small{display:block;color:#aaa5c5;font-size:10px;letter-spacing:1.5px;margin-top:2px}.navlabel{font-size:10px;letter-spacing:1.7px;color:#8d87ab;padding:15px 12px 8px}.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 13px;margin:2px 0;border-radius:11px;color:#c9c5db;background:transparent;text-align:left;font-size:13px}.nav button.active,.nav button:hover{background:#39315d;color:#fff}.nav .ico{width:19px;text-align:center;font-size:16px}.sidebottom{margin-top:auto;padding:16px 10px 0;border-top:1px solid #3b3558;color:#a9a4bd;font-size:11px;line-height:1.7}.demo-pill{display:inline-block;background:#3b315f;color:#d9f36a;padding:4px 8px;border-radius:20px;font-size:9px;font-weight:800;letter-spacing:1px;margin-bottom:8px}.main{flex:1;min-width:0}.topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:5}.crumb{font-size:12px;color:var(--muted)}.crumb b{color:var(--ink)}.topright{display:flex;align-items:center;gap:12px}.festname{font-size:12px;font-weight:700}.avatar{width:34px;height:34px;border-radius:50%;background:#eee9ff;color:var(--purple);display:grid;place-items:center;font-weight:800}.role{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff;color:var(--ink);font-size:11px}.content{padding:30px 34px 55px;max-width:1500px;margin:auto}.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:15px;margin-bottom:24px}.eyebrow{color:var(--purple);font-size:10px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase}.pagehead h1{font:800 27px Manrope;margin:6px 0}.sub{font-size:12px;color:var(--muted)}.btn{background:var(--purple);color:#fff;border-radius:9px;padding:10px 15px;font-size:12px;font-weight:700;box-shadow:0 5px 13px #6548d826}.btn:hover{background:#5236c2}.btn.secondary{background:#f0edff;color:var(--purple);box-shadow:none}.btn.dark{background:#26213f}.btn.lime{background:var(--lime);color:#27213d;box-shadow:none}.btn.small{padding:7px 10px;font-size:11px}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}.stat{padding:19px}.stathead{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.staticon{width:31px;height:31px;border-radius:10px;background:#f0edff;color:var(--purple);display:grid;place-items:center}.statnum{font:800 27px Manrope;margin:12px 0 3px}.statfoot{font-size:10px;color:var(--green)}.cols{grid-template-columns:1.4fr 1fr}.panel{padding:19px;margin-bottom:16px}.panelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.panel h3{font:800 14px Manrope;margin:0}.muted{color:var(--muted);font-size:11px}.progress{height:7px;background:#f0eef6;border-radius:20px;overflow:hidden}.progress span{display:block;height:100%;background:var(--purple);border-radius:20px}.eventrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #f0eef5}.eventrow:last-child{border:0}.eventbadge{width:37px;height:37px;background:#f0edff;color:var(--purple);border-radius:11px;display:grid;place-items:center;font-size:16px}.eventinfo{flex:1}.eventinfo b{font-size:12px;display:block}.eventinfo small{font-size:10px;color:var(--muted)}.tag{display:inline-block;border-radius:30px;padding:5px 9px;font-size:9px;font-weight:800;background:#edf8f3;color:var(--green)}.tag.purple{background:#f0edff;color:var(--purple)}.tag.amber{background:#fff5df;color:#a26b08}.tablewrap{overflow:auto}.toolbar{display:flex;gap:9px;align-items:center;margin-bottom:14px;flex-wrap:wrap}.search{border:1px solid var(--line);border-radius:9px;padding:9px 12px;min-width:210px;font-size:11px;outline:none}.search:focus,input:focus,select:focus{border-color:var(--purple)}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;color:#858398;font-size:9px;text-transform:uppercase;letter-spacing:1px;padding:11px 10px;background:#faf9fc}td{font-size:11px;padding:12px 10px;border-bottom:1px solid #f0eef5}td b{font-weight:700}.empty{padding:35px;text-align:center;color:var(--muted);font-size:12px}.groupcards{grid-template-columns:repeat(4,minmax(0,1fr))}.groupcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}.groupdot{width:32px;height:32px;border-radius:10px;background:#f0edff;color:var(--purple);display:grid;place-items:center;font-weight:800}.groupcard h3{font:800 14px Manrope;margin:12px 0 4px}.groupcard p{font-size:10px;color:var(--muted);margin:0 0 12px}.criteria{display:flex;gap:8px;flex-wrap:wrap}.criterion{padding:7px 10px;background:#f5f3fb;border-radius:8px;font-size:10px}.scoreinput{width:65px;border:1px solid var(--line);border-radius:7px;padding:6px}.notice{background:#f0edff;border:1px solid #e2dcff;color:#4d3b9d;padding:12px 14px;border-radius:11px;font-size:11px;line-height:1.6;margin-bottom:16px}.scorehero{background:#241e42;color:#fff;border-radius:16px;padding:22px;display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.scorehero h2{font:800 20px Manrope;margin:4px 0}.scorehero p{font-size:11px;color:#bdb7d2;margin:0}.rank{font:800 24px Manrope;color:var(--lime)}.certificate{border:1px solid #d9d0ff;border-radius:13px;padding:18px;text-align:center;background:linear-gradient(135deg,#fff,#f7f4ff)}.certificate h2{font:800 18px Manrope;color:#33255f}.certificate .certname{font:800 21px Manrope;margin:12px 0;color:#201b3b}.certificate small{font-size:10px;color:var(--muted)}.modalback{position:fixed;inset:0;background:#17132b88;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modalback.show{display:flex}.modal{background:#fff;border-radius:16px;padding:22px;width:min(540px,100%);max-height:90vh;overflow:auto}.modal h2{font:800 18px Manrope;margin:0 0 6px}.field{display:flex;flex-direction:column;gap:6px;margin:13px 0}.field label{font-size:10px;color:var(--muted);font-weight:700}.field input,.field select{padding:10px;border:1px solid var(--line);border-radius:8px;font-size:12px}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.toast{position:fixed;right:22px;bottom:22px;background:#201b3b;color:#fff;padding:12px 16px;border-radius:10px;font-size:12px;z-index:30;display:none}.toast.show{display:block}.qr{display:inline-block;padding:8px;background:#fff;border:1px solid var(--line);border-radius:9px}.mobilemenu{display:none}
@media(max-width:1000px){.sidebar{width:205px}.content{padding:24px 20px}.topbar{padding:0 20px}.stats{grid-template-columns:repeat(2,1fr)}.groupcards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.sidebar{display:none}.topbar{height:62px;padding:0 14px}.content{padding:20px 13px 40px}.pagehead{align-items:flex-start;flex-direction:column}.stats{gap:9px}.stat{padding:13px}.statnum{font-size:22px}.cols{grid-template-columns:1fr}.groupcards{grid-template-columns:1fr 1fr}.role{max-width:135px}.festname{display:none}}
@media print{.sidebar,.topbar,.pagehead .btn,.toolbar,.no-print{display:none!important}.main{width:100%}.content{padding:0}.certificate{page-break-after:always;min-height:90vh;display:flex;flex-direction:column;justify-content:center}.panel{box-shadow:none}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar"><div class="brand"><div class="brandmark">F</div><div><strong>festflow</strong><small>COLLEGE FEST PLATFORM</small></div></div>
<div class="navlabel">WORKSPACE</div><nav class="nav" id="nav">
<button class="active" data-page="overview"><span class="ico">◫</span>Overview</button>
<button data-page="students"><span class="ico">♙</span>Students</button>
<button data-page="groups"><span class="ico">◉</span>Groups & Departments</button>
<button data-page="programs"><span class="ico">✦</span>Programme items</button>
<button data-page="registrations"><span class="ico">▤</span>Registrations</button>
<button data-page="stage"><span class="ico">▣</span>Stage reporting</button>
<button data-page="judging"><span class="ico">★</span>Judges portal</button>
<button data-page="results"><span class="ico">♜</span>Results & scoreboard</button>
<button data-page="certificates"><span class="ico">▧</span>Certificates</button></nav>
<div class="sidebottom"><span class="demo-pill">DEMO ENVIRONMENT</span><br>Advanta Institute of Management<br>Annual Arts & Tech Fest 2026<br>All names and records are fictional.</div></aside>
<main class="main"><header class="topbar"><div class="crumb">FestFlow <span style="padding:0 7px">/</span><b id="crumb">Overview</b></div><div class="topright"><span class="festname">AIM FEST 2026</span><select class="role" id="role"><option>Fest Convenor</option><option>Group Coordinator</option><option>Stage Manager</option><option>Judge</option><option>Student</option><option>Public Viewer</option></select><div class="avatar">A</div></div></header>
<div class="content" id="view"></div></main></div>
<div class="modalback" id="modalback"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div>
<script>
const depts=['Management','Computer Science','Commerce','English','Media Studies'],colors=['#7657df','#0d9670','#df8b36','#d75c88'];
const first=['Aarav','Aadhya','Adil','Aisha','Akash','Ananya','Arjun','Diya','Faris','Gopika','Hari','Isha','Jithin','Kavya','Krishna','Meera','Nihal','Nisha','Rahul','Riya','Sanjay','Sneha','Tara','Varun','Zoya','Abhinav','Amala','Bilal','Devika','Fathima'];
const last=['Nair','Menon','Thomas','Khan','Pillai','Varma','Joseph','Das','Rao','Sharma','Ali','George'];
const state={page:'overview',role:'Fest Convenor',students:[],groups:[],items:[],regs:[],scores:{},reported:new Set(),published:false};
function seed(){if(localStorage.getItem('festflow-demo-v1')){Object.assign(state,JSON.parse(localStorage.getItem('festflow-demo-v1')));state.reported=new Set(state.reported||[]);return}
for(let i=1;i<=300;i++){let d=(i-1)%5;state.students.push({id:i,roll:'AIM26'+String(i).padStart(3,'0'),name:first[(i*7)%first.length]+' '+last[(i*3)%last.length],dept:depts[d],year:['I','II','III'][i%3],group:['Violet','Emerald','Amber','Coral'][i%4],chest:'AIM-'+String(i).padStart(4,'0')})}
state.groups=['Violet','Emerald','Amber','Coral'].map((n,i)=>({name:n,dept:'Mixed departments',color:colors[i]}));
state.items=[
['Solo Singing','Individual','Music','Open'],['Classical Dance','Individual','Dance','Open'],['Extempore','Individual','Literary','Open'],['Photography','Individual','Media','Open'],['Quiz','Group','General','Open'],['Group Dance','Group','Dance','Open'],['Mime','Group','Theatre','Open'],['Short Film','Group','Media','Open'],['Business Plan','Group','Management','Open'],['Coding Sprint','Group','Technology','Open'],['Poetry','Individual','Literary','Open'],['Debate','Individual','Literary','Open'],['Western Vocal','Individual','Music','Open'],['Street Play','Group','Theatre','Open'],['Poster Design','Individual','Art','Open'],['Treasure Hunt','Group','General','Open'],['Fashion Walk','Group','Fashion','Open'],['Ad Making','Group','Media','Open'],['Web Design','Group','Technology','Open'],['Instrumental','Individual','Music','Open'],['Stand-up','Individual','Theatre','Open'],['E-sports','Group','Gaming','Open'],['Collage','Group','Art','Open'],['Product Pitch','Group','Management','Open'],['Essay Writing','Individual','Literary','Open']
].map((x,i)=>({id:i+1,name:x[0],type:x[1],category:x[2],status:'Open',criteria:[{name:'Content & originality',max:40},{name:'Execution',max:30},{name:'Presentation',max:20},{name:'Overall impact',max:10}]}));
state.regs=[];
for(let i=0;i<220;i++){let st=state.students[i],item=state.items[i%state.items.length];state.regs.push({id:i+1,studentId:st.id,itemId:item.id,reported:i<34,points:0})}
state.reported=new Set(state.regs.filter(r=>r.reported).map(r=>r.id));persist()}
function persist(){localStorage.setItem('festflow-demo-v1',JSON.stringify({...state,reported:[...state.reported]}))}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
function setPage(p){state.page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('crumb').textContent=({overview:'Overview',students:'Students',groups:'Groups & Departments',programs:'Programme items',registrations:'Registrations',stage:'Stage reporting',judging:'Judges portal',results:'Results & scoreboard',certificates:'Certificates'})[p];render()}
function head(title,sub,action=''){return '<div class="pagehead"><div><div class="eyebrow">AIM FEST 2026 · DEMO</div><h1>'+title+'</h1><div class="sub">'+sub+'</div></div>'+action+'</div>'}
function stat(label,num,foot,ico){return '<div class="stat"><div class="stathead"><span>'+label+'</span><span class="staticon">'+ico+'</span></div><div class="statnum">'+num+'</div><div class="statfoot">'+foot+'</div></div>'}
function panel(title,body,extra=''){return '<section class="panel"><div class="panelhead"><h3>'+title+'</h3>'+extra+'</div>'+body+'</section>'}
function render(){let v=document.getElementById('view');switch(state.page){case'overview':v.innerHTML=overview();break;case'students':v.innerHTML=students();break;case'groups':v.innerHTML=groups();break;case'programs':v.innerHTML=programs();break;case'registrations':v.innerHTML=registrations();break;case'stage':v.innerHTML=stage();break;case'judging':v.innerHTML=judging();break;case'results':v.innerHTML=results();break;case'certificates':v.innerHTML=certificates();break}}
function overview(){return head('Your fest, in full flow.','A live command centre for every moving part of your campus celebration.')+'<div class="grid stats">'+stat('STUDENTS','300','Bulk uploaded successfully','♙')+stat('GROUPS','4','Mixed-department groups','◉')+stat('PROGRAMME ITEMS','25','Individual & group events','✦')+stat('REGISTRATIONS',state.regs.length,'Across all programme items','▤')+'</div><div class="grid cols"><div>'+panel('Programme activity','<div class="eventrow"><div class="eventbadge">♬</div><div class="eventinfo"><b>Solo Singing</b><small>Individual · Music</small></div><span class="tag purple">34 entries</span></div><div class="eventrow"><div class="eventbadge">✧</div><div class="eventinfo"><b>Group Dance</b><small>Group · Dance</small></div><span class="tag">12 teams</span></div><div class="eventrow"><div class="eventbadge">⌘</div><div class="eventinfo"><b>Coding Sprint</b><small>Group · Technology</small></div><span class="tag amber">Registration open</span></div><div class="eventrow"><div class="eventbadge">☷</div><div class="eventinfo"><b>Business Plan</b><small>Group · Management</small></div><span class="tag">8 teams</span></div>')+panel('Fest workflow','<div class="eventrow"><div class="eventbadge">✓</div><div class="eventinfo"><b>Student onboarding</b><small>300 fictional student records</small></div><span class="tag">Complete</span></div><div class="eventrow"><div class="eventbadge">✓</div><div class="eventinfo"><b>Group allocation</b><small>Four groups created</small></div><span class="tag">Complete</span></div><div class="eventrow"><div class="eventbadge">◷</div><div class="eventinfo"><b>Stage reporting</b><small>'+state.reported.size+' candidates checked in</small></div><span class="tag amber">In progress</span></div><div class="eventrow"><div class="eventbadge">★</div><div class="eventinfo"><b>Results publication</b><small>'+(state.published?'Results are published':'Awaiting convenor approval')+'</small></div><span class="tag '+(state.published?'':'amber')+'">'+(state.published?'Published':'Pending')+'</span></div>')+'</div><div>'+panel('Live group standings',scoreTable())+panel('Paperless campus','<div class="notice" style="margin:0">Digital registrations, QR-based stage reporting, online judging records and downloadable e-certificates help reduce paper use and support institutional green-campus documentation.</div><div style="display:flex;justify-content:space-between;margin-top:14px"><span class="muted">E-certificate access</span><b style="font-size:11px;color:var(--green)">Included for lifetime</b></div>')+'</div></div>'}
function students(){return head('Student directory','300 fictional student profiles · bulk upload ready','<button class="btn" onclick="openImport()">＋ Bulk upload CSV</button>')+panel('All students','<div class="toolbar"><input class="search" id="studentSearch" placeholder="Search name, roll number or department..." oninput="filterStudents()"><button class="btn secondary small" onclick="downloadStudents()">↓ Download CSV</button><span class="muted">300 records · DEMO DATA</span></div><div class="tablewrap"><table id="studentTable"><thead><tr><th>Student</th><th>Roll number</th><th>Department</th><th>Year</th><th>Group</th><th>Chest number</th></tr></thead><tbody>'+state.students.slice(0,60).map(s=>'<tr><td><b>'+s.name+'</b></td><td>'+s.roll+'</td><td>'+s.dept+'</td><td>'+s.year+'</td><td><span class="tag purple">'+s.group+'</span></td><td>'+s.chest+'</td></tr>').join('')+'</tbody></table></div><div class="muted" style="padding-top:12px">Showing first 60 records. Search to filter the complete directory.</div>')}
function groups(){return head('Groups & departments','Shuffle students into balanced teams, or build groups around departments.','<button class="btn" onclick="shuffleGroups()">⤨ Auto shuffle</button>')+'<div class="notice">You can run competitions between mixed groups, departments, or a custom combination of departments. Auto shuffle distributes students across four groups.</div><div class="grid groupcards">'+state.groups.map((g,i)=>'<div class="groupcard"><div class="groupdot" style="background:'+g.color+'22;color:'+g.color+'">'+(i+1)+'</div><h3>'+g.name+'</h3><p>'+g.dept+'</p><b style="font:800 22px Manrope">'+state.students.filter(s=>s.group===g.name).length+'</b><div class="muted">students allocated</div><div class="progress" style="margin-top:13px"><span style="width:'+Math.round(state.students.filter(s=>s.group===g.name).length/3)+'%;background:'+g.color+'"></span></div></div>').join('')+'</div>'+panel('Create department-based group','<div class="toolbar"><input class="search" id="newGroup" placeholder="Group name"><select class="search" id="deptSelect"><option value="">Choose department</option>'+depts.map(d=>'<option>'+d+'</option>').join('')+'</select><button class="btn small" onclick="createDeptGroup()">Create group</button></div><div class="muted">Create a dedicated department group. For combined groups, select multiple departments in the group setup workflow (demo preview).</div>')+panel('Group roster','<div class="toolbar"><select class="search" id="groupFilter" onchange="filterGroupRoster()"><option value="">All groups</option>'+state.groups.map(g=>'<option>'+g.name+'</option>').join('')+'</select><button class="btn secondary small" onclick="downloadGroupRoster()">↓ Download roster</button></div><div class="tablewrap" id="roster">'+rosterRows()+'</div>')}
function rosterRows(){return '<table><thead><tr><th>Student</th><th>Department</th><th>Group</th></tr></thead><tbody>'+state.students.slice(0,20).map(s=>'<tr><td>'+s.name+'</td><td>'+s.dept+'</td><td>'+s.group+'</td></tr>').join('')+'</tbody></table>'}
function programs(){return head('Programme items','25 curated competitions · individual and team participation','<button class="btn" onclick="addItem()">＋ Add programme item</button>')+panel('Programme catalogue','<div class="toolbar"><input class="search" id="itemSearch" placeholder="Search programme items..." oninput="filterItems()"><select class="search" id="typeFilter" onchange="filterItems()"><option value="">All formats</option><option>Individual</option><option>Group</option></select></div><div class="tablewrap"><table id="itemTable"><thead><tr><th>Programme item</th><th>Format</th><th>Category</th><th>Judging criteria</th><th>Registration</th></tr></thead><tbody>'+state.items.map(item=>itemRow(item)).join('')+'</tbody></table></div>')}
function itemRow(x){return '<tr><td><b>'+x.name+'</b></td><td><span class="tag '+(x.type==='Group'?'purple':'')+'">'+x.type+'</span></td><td>'+x.category+'</td><td>'+x.criteria.length+' criteria · 100 points</td><td><span class="tag">'+x.status+'</span></td></tr>'}
function registrations(){return head('Registrations','Student entries across all programme items. Coordinators can export their rosters.','<button class="btn secondary" onclick="downloadRegs()">↓ Export registrations</button>')+panel('Registration register','<div class="toolbar"><input class="search" placeholder="Search student or event..." id="regSearch" oninput="filterRegs()"><span class="muted">'+state.regs.length+' registrations</span></div><div class="tablewrap"><table id="regTable"><thead><tr><th>Chest number</th><th>Student</th><th>Programme item</th><th>Format</th><th>Group</th><th>Stage status</th></tr></thead><tbody>'+regRows()+'</tbody></table></div>')}
function regRows(){return state.regs.slice(0,100).map(r=>{let s=state.students.find(x=>x.id===r.studentId),it=state.items.find(x=>x.id===r.itemId);return '<tr><td><b>'+s.chest+'</b></td><td>'+s.name+'</td><td>'+it.name+'</td><td>'+it.type+'</td><td>'+s.group+'</td><td><span class="tag '+(state.reported.has(r.id)?'':'amber')+'">'+(state.reported.has(r.id)?'Reported':'Not reported')+'</span></td></tr>'}).join('')}
function stage(){let pending=state.regs.filter(r=>!state.reported.has(r.id)).slice(0,20);return head('Stage reporting desk','Scan the candidate QR code or search by chest number to confirm arrival.')+'<div class="grid cols"><div>'+panel('QR check-in','<div class="notice">When a candidate is checked in, their entry appears in the judges portal automatically.</div><div class="field"><label>CHEST NUMBER</label><input id="chestInput" placeholder="e.g. AIM-0001"></div><button class="btn" onclick="checkIn()">Confirm candidate reported</button><div class="muted" style="margin-top:12px">Demo shortcut: select any candidate from the pending list.</div>')+panel('Pending candidates','<div class="tablewrap"><table><thead><tr><th>Chest no.</th><th>Candidate</th><th>Programme item</th><th></th></tr></thead><tbody>'+pending.slice(0,10).map(r=>{let s=state.students.find(x=>x.id===r.studentId),it=state.items.find(x=>x.id===r.itemId);return '<tr><td>'+s.chest+'</td><td>'+s.name+'</td><td>'+it.name+'</td><td><button class="btn small" onclick="quickCheck('+r.id+')">Report</button></td></tr>'}).join('')+'</tbody></table></div>')+'</div><div>'+panel('Reported candidates','<div class="statnum">'+state.reported.size+'</div><div class="muted">Candidates checked in</div><div class="progress" style="margin:14px 0"><span style="width:'+Math.min(100,state.reported.size/state.regs.length*100)+'%"></span></div><div class="muted">Judges can now see '+state.reported.size+' reported entries in their assigned programme items.</div>')+panel('QR preview','<div style="text-align:center"><div id="qrDemo" class="qr"></div><div class="muted" style="margin-top:9px">Sample chest-number QR</div></div>')+'</div></div>'}
function judging(){let eligible=state.regs.filter(r=>state.reported.has(r.id));return head('Judges workspace','Only candidates marked as reported by the stage manager appear here.')+'<div class="notice">Judge role preview · Scores are saved in this demo browser. Final results remain unpublished until the fest convenor approves them.</div>'+panel('Reported entries','<div class="toolbar"><select class="search" id="judgeItem" onchange="renderJudgeRows()">'+state.items.map(x=>'<option value="'+x.id+'">'+x.name+'</option>').join('')+'</select><span class="muted">'+eligible.length+' reported entries available</span></div><div id="judgeRows">'+judgeRows(state.items[0].id)+'</div>')}
function judgeRows(itemId){let item=state.items.find(x=>x.id==itemId),rows=state.regs.filter(r=>r.itemId==itemId&&state.reported.has(r.id));return rows.length?'<div class="tablewrap"><table><thead><tr><th>Candidate</th><th>Chest number</th><th>Criteria scoring</th><th>Total</th><th></th></tr></thead><tbody>'+rows.map(r=>{let s=state.students.find(x=>x.id===r.studentId),vals=state.scores[r.id]||[35,25,17,8];return '<tr><td><b>'+s.name+'</b></td><td>'+s.chest+'</td><td><div class="criteria">'+item.criteria.map((c,i)=>'<label class="criterion">'+c.name+' <input class="scoreinput" type="number" min="0" max="'+c.max+'" value="'+(vals[i]||0)+'" id="sc'+r.id+'-'+i+'"></label>').join('')+'</div></td><td><b id="total'+r.id+'">'+vals.reduce((a,b)=>a+b,0)+'/100</b></td><td><button class="btn small" onclick="saveScore('+r.id+','+itemId+')">Submit</button></td></tr>'}).join('')+'</tbody></table></div>':'<div class="empty">No candidates have been reported for this programme item yet.</div>'}
function results(){return head('Results & scoreboard','Review judge submissions, publish approved results and celebrate the winning groups.','<button class="btn lime" onclick="publishResults()">✓ Publish results</button>')+(state.published?'<div class="scorehero"><div><div class="eyebrow" style="color:var(--lime)">LIVE SCOREBOARD</div><h2>AIM FEST 2026</h2><p>Results published by Fest Convenor · standings updated</p></div><div class="rank">LIVE ↗</div></div>':'<div class="notice">Results are currently in draft. The fest convenor controls publication. Judge points are not visible on the public scoreboard until published.</div>')+panel('Group leaderboard',scoreTable())+panel('Judge submissions','<div class="muted">Submitted scores are compiled for convenor review. Publish results to release standings.</div><div class="tablewrap" style="margin-top:12px"><table><thead><tr><th>Programme item</th><th>Candidate</th><th>Points</th><th>Status</th></tr></thead><tbody>'+state.regs.filter(r=>state.scores[r.id]).slice(0,15).map(r=>{let s=state.students.find(x=>x.id===r.studentId),it=state.items.find(x=>x.id===r.itemId);return '<tr><td>'+it.name+'</td><td>'+s.name+'</td><td>'+state.scores[r.id].reduce((a,b)=>a+b,0)+'</td><td><span class="tag '+(state.published?'':'amber')+'">'+(state.published?'Published':'Submitted')+'</span></td></tr>'}).join('')+'</tbody></table></div>')}
function scoreTable(){let points=state.groups.map(g=>({name:g.name,points:state.regs.filter(r=>state.students.find(s=>s.id===r.studentId)?.group===g.name&&state.scores[r.id]).reduce((sum,r)=>sum+state.scores[r.id].reduce((a,b)=>a+b,0),0)})).sort((a,b)=>b.points-a.points);if(!points.some(x=>x.points))points=points.map((x,i)=>({...x,points:[420,385,340,310][i]}));return '<table><thead><tr><th>Rank</th><th>Group</th><th>Points</th><th>Progress</th></tr></thead><tbody>'+points.map((g,i)=>'<tr><td><b>#'+(i+1)+'</b></td><td><b>'+g.name+'</b></td><td>'+g.points+'</td><td style="width:28%"><div class="progress"><span style="width:'+Math.max(8,g.points/Math.max(...points.map(p=>p.points))*100)+'%"></span></div></td></tr>').join('')+'</tbody></table>'}
function certificates(){return head('Digital certificates','Generate participation and achievement certificates as downloadable, print-ready PDFs.','<button class="btn" onclick="window.print()">↓ Bulk print / save PDF</button>')+'<div class="notice">Complimentary bulk e-certificate generation platform · lifetime access. Choose a student below to preview a personalised certificate, or print the certificate batch to PDF.</div>'+panel('Certificate preview','<div class="toolbar"><select class="search" id="certStudent" onchange="renderCert()">'+state.students.slice(0,60).map(s=>'<option value="'+s.id+'">'+s.name+' · '+s.roll+'</option>').join('')+'</select><select class="search" id="certType" onchange="renderCert()"><option>Participation</option><option>First Prize</option><option>Second Prize</option><option>Third Prize</option></select><button class="btn secondary small no-print" onclick="window.print()">Print / Save PDF</button></div><div id="certPreview"></div>')}
function renderCert(){let s=state.students.find(x=>x.id==document.getElementById('certStudent').value),type=document.getElementById('certType').value;document.getElementById('certPreview').innerHTML='<div class="certificate"><div class="eyebrow">ADVANTA INSTITUTE OF MANAGEMENT · AIM FEST 2026</div><div style="font-size:35px;margin:12px">✧</div><h2>CERTIFICATE OF '+(type==='Participation'?'PARTICIPATION':'ACHIEVEMENT')+'</h2><small>This certificate is proudly presented to</small><div class="certname">'+s.name+'</div><small>Chest Number: '+s.chest+' · '+s.dept+'</small><p style="font-size:12px;color:#514b67;margin:18px 0">In recognition of '+(type==='Participation'?'participating in':'securing '+type+' in')+' AIM Fest 2026.</p><div style="display:flex;justify-content:space-around;margin-top:30px"><div><b>Fest Convenor</b><hr>Authorised Signature</div><div><b>Principal</b><hr>Institution Seal</div></div><small style="margin-top:28px">DIGITALLY GENERATED CERTIFICATE · PAPERLESS CAMPUS INITIATIVE</small></div>'}
function filterStudents(){let q=document.getElementById('studentSearch').value.toLowerCase(),rows=state.students.filter(s=>(s.name+s.roll+s.dept+s.group).toLowerCase().includes(q)).slice(0,100);document.querySelector('#studentTable tbody').innerHTML=rows.map(s=>'<tr><td><b>'+s.name+'</b></td><td>'+s.roll+'</td><td>'+s.dept+'</td><td>'+s.year+'</td><td>'+s.group+'</td><td>'+s.chest+'</td></tr>').join('')}
function filterItems(){let q=document.getElementById('itemSearch').value.toLowerCase(),t=document.getElementById('typeFilter').value;document.querySelector('#itemTable tbody').innerHTML=state.items.filter(x=>x.name.toLowerCase().includes(q)&&(!t||x.type===t)).map(itemRow).join('')}
function filterRegs(){let q=document.getElementById('regSearch').value.toLowerCase();document.querySelector('#regTable tbody').innerHTML=regRows().split('</tr>').filter(row=>row.toLowerCase().includes(q)).join('</tr>')}
function renderJudgeRows(){document.getElementById('judgeRows').innerHTML=judgeRows(document.getElementById('judgeItem').value)}
function quickCheck(id){state.reported.add(id);persist();render();toast('Candidate reported. Judge workspace updated.')}
function checkIn(){let c=document.getElementById('chestInput').value.trim().toUpperCase(),s=state.students.find(x=>x.chest===c);if(!s){toast('Chest number not found');return}let r=state.regs.find(x=>x.studentId===s.id);if(!r){toast('No active registration found');return}quickCheck(r.id)}
function saveScore(id,itemId){let item=state.items.find(x=>x.id===itemId),vals=item.criteria.map((c,i)=>Math.min(c.max,Math.max(0,Number(document.getElementById('sc'+id+'-'+i).value)||0)));state.scores[id]=vals;persist();renderJudgeRows();toast('Judge points submitted successfully.')}
function publishResults(){if(!Object.keys(state.scores).length){toast('No judge scores submitted yet');return}if(!confirm('Publish judge scores and update the public scoreboard?'))return;state.published=true;persist();render();toast('Results published. Scoreboard is now live.')}
function shuffleGroups(){state.students.forEach((s,i)=>s.group=state.groups[i%state.groups.length].name);persist();render();toast('300 students redistributed across four groups.')}
function createDeptGroup(){let name=document.getElementById('newGroup').value.trim(),dept=document.getElementById('deptSelect').value;if(!name||!dept){toast('Enter a group name and choose a department');return}state.groups.push({name,dept,color:colors[state.groups.length%4]});state.students.filter(s=>s.dept===dept).forEach(s=>s.group=name);persist();render();toast('Department group created.')}
function filterGroupRoster(){let g=document.getElementById('groupFilter').value;let arr=state.students.filter(s=>!g||s.group===g).slice(0,80);document.getElementById('roster').innerHTML='<table><thead><tr><th>Student</th><th>Department</th><th>Group</th></tr></thead><tbody>'+arr.map(s=>'<tr><td>'+s.name+'</td><td>'+s.dept+'</td><td>'+s.group+'</td></tr>').join('')+'</tbody></table>'}
function csvDownload(name,rows){let csv=rows.map(r=>r.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
function downloadStudents(){csvDownload('AIM-demo-students.csv',[['Name','Roll','Department','Year','Group','Chest number'],...state.students.map(s=>[s.name,s.roll,s.dept,s.year,s.group,s.chest])])}
function downloadGroupRoster(){csvDownload('AIM-demo-group-roster.csv',[['Name','Roll','Department','Group'],...state.students.map(s=>[s.name,s.roll,s.dept,s.group])])}
function downloadRegs(){csvDownload('AIM-demo-registrations.csv',[['Chest','Student','Programme','Group','Reported'],...state.regs.map(r=>{let s=state.students.find(x=>x.id===r.studentId);return[s.chest,s.name,state.items.find(x=>x.id===r.itemId).name,s.group,state.reported.has(r.id)?'Yes':'No']})])}
function openImport(){showModal('<h2>Bulk upload students</h2><div class="sub">Upload a CSV with Name, Roll Number, Department and Year columns.</div><div class="field"><label>STUDENT CSV FILE</label><input type="file" id="csvfile" accept=".csv,text/csv"></div><div class="notice">Demo import adds valid rows to this browser session. Duplicate roll numbers are skipped.</div><div class="modalactions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="importCsv()">Import students</button></div>')}
function importCsv(){let f=document.getElementById('csvfile').files[0];if(!f){toast('Choose a CSV file');return}let reader=new FileReader();reader.onload=()=>{let lines=reader.result.split(/\r?\n/).filter(Boolean),head=lines.shift().toLowerCase().split(',');let count=0;lines.forEach(line=>{let a=line.split(',').map(x=>x.trim().replace(/^"|"$/g,'')),o={};head.forEach((h,i)=>o[h]=a[i]||'');let name=o.name||o['student name'],roll=o['roll number']||o.roll||('IMP'+Date.now()+count),dept=o.department||depts[0];if(name&&!state.students.some(s=>s.roll===roll)){let id=state.students.length+1;state.students.push({id,roll,name,dept,year:o.year||'I',group:state.groups[(id-1)%state.groups.length].name,chest:'AIM-'+String(id).padStart(4,'0')});count++}});persist();closeModal();render();toast(count+' student records imported.')}};reader.readAsText(f)}
function addItem(){showModal('<h2>Add programme item</h2><div class="field"><label>ITEM NAME</label><input id="itemName" placeholder="e.g. Folk Dance"></div><div class="field"><label>PARTICIPATION FORMAT</label><select id="itemType"><option>Individual</option><option>Group</option></select></div><div class="field"><label>CATEGORY</label><input id="itemCat" placeholder="e.g. Dance"></div><div class="modalactions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveItem()">Create item</button></div>')}
function saveItem(){let name=document.getElementById('itemName').value.trim();if(!name)return toast('Enter an item name');state.items.push({id:state.items.length+1,name,type:document.getElementById('itemType').value,category:document.getElementById('itemCat').value||'General',status:'Open',criteria:[{name:'Content & originality',max:40},{name:'Execution',max:30},{name:'Presentation',max:20},{name:'Overall impact',max:10}]});persist();closeModal();render();toast('Programme item created with default judging criteria.')}
function showModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalback').classList.add('show')}function closeModal(){document.getElementById('modalback').classList.remove('show')}
document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)setPage(b.dataset.page)});
document.getElementById('role').addEventListener('change',e=>{state.role=e.target.value;toast('Previewing '+state.role+' permissions')});
seed();render();if(state.page==='certificates')renderCert();if(state.page==='stage'&&window.QRCode)new QRCode(document.getElementById('qrDemo'),{text:'AIM-0001',width:110,height:110});
</script>
</body></html>
